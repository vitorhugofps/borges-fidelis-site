name: Fetch old site assets
on:
  push:
    branches: [assets]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download originals from advogandoparamedicos.com.br
        run: |
          set -e
          mkdir -p _source/old-site/img
          cd _source/old-site
          curl -sSL -A "Mozilla/5.0" https://advogandoparamedicos.com.br/ -o index.html
          curl -sSL -A "Mozilla/5.0" "https://advogandoparamedicos.com.br/wp-json/wp/v2/media?per_page=100" -o media.json
          curl -sSL -A "Mozilla/5.0" "https://advogandoparamedicos.com.br/wp-json/wp/v2/pages?per_page=100&_fields=id,slug,link,title" -o pages.json || true
          curl -sSL -A "Mozilla/5.0" "https://advogandoparamedicos.com.br/wp-json/wp/v2/posts?per_page=100&_fields=id,slug,link,title,date" -o posts.json || true
          cd img
          for u in \
            2026/02/Borges-e-Fidelis-3.jpg \
            2026/02/Borges-e-Fidelis-2.jpg \
            2026/02/Borges-e-Fidelis-1.jpg \
            2026/02/parede-completa.png \
            2026/02/Borges-e-Fidelis.png \
            2026/02/Dra-Tuane-Borges-Borges-e-Bidelis.jpg \
            2026/02/Dra-Flavia-Fidelis-Borges-e-Bidelis.jpg \
            2026/02/BorgesFidelis-H.png \
            2026/02/BorgesFidelis.png \
            2026/02/Borges-e-Fidelis_ADV.svg \
            2024/01/bg.webp \
            2024/01/escritorio5-scaled.webp \
            2024/01/escritorio3-scaled.webp \
            2024/01/team-young-specialist-doctors-standing-corridor-hospital.webp ; do
            curl -sSL -A "Mozilla/5.0" "https://advogandoparamedicos.com.br/wp-content/uploads/$u" -o "$(basename "$u")" || echo "fail $u"
          done
          # any other upload referenced in the homepage html
          grep -oE 'https://advogandoparamedicos.com.br/wp-content/uploads/[^"'"'"' )]+\.(jpg|jpeg|png|webp|svg|gif|ico)' ../index.html | sort -u > ../referenced.txt || true
          ls -la
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _source
          git commit -m "Assets originais do site antigo (download automático)" || echo "nada novo"
          git push
